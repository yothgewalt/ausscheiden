# Dev only. Ports bind to 127.0.0.1 so Postgres/Redis are reachable from THIS
# machine, never the LAN (Docker's default "5432:5432" publishes on 0.0.0.0).
# The weak password is a localhost-only dev convenience — PROD creds are required
# env vars + Redis requirepass, see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ausscheiden
      POSTGRES_PASSWORD: ausscheiden
      POSTGRES_DB: ausscheiden
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ausscheiden"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ausscheiden
      MINIO_ROOT_PASSWORD: ausscheiden
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - miniodata:/data

  createbuckets:   # one-shot: wait for minio, make the slips bucket, exit
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 ausscheiden ausscheiden;
      do sleep 1; done; mc mb --ignore-existing local/slips"

volumes:
  pgdata:
  redisdata:
  miniodata:
