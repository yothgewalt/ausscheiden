services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3000/api/trpc}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Credentials come from the environment (see .env.example). `:?` makes compose
      # REFUSE to start if unset — no weak baked-in default to forget to override.
      DATABASE_URL: postgres://ausscheiden:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ausscheiden
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      # Signs the session cookie. Optional: unset ⇒ the app mints a random
      # per-process key (cookies reset on restart) instead of failing. Set it to
      # keep signatures stable across restarts/redeploys.
      SESSION_SECRET: ${SESSION_SECRET:-}
      RDCW_CLIENT_ID: ${RDCW_CLIENT_ID:-}
      RDCW_CLIENT_SECRET: ${RDCW_CLIENT_SECRET:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: slips
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # Tracing. Unset this to turn tracing off entirely (the app then registers
      # no tracer and every span is a non-recording no-op).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: ausscheiden
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ausscheiden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ausscheiden
    ports:
      # Published for external DB tools. Loopback on the prod host by default
      # (reach via SSH tunnel); set DB_BIND=0.0.0.0 in .env to open to the network.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ausscheiden"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass: Redis holds payment tokens + locks. On a shared host an
    # unauthenticated Redis is a trivial pivot — a token forged straight into the
    # keyspace confirms a booking. Auth it; the app dials redis://:PASSWORD@redis.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      # So the healthcheck's redis-cli -a can read it inside the container.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      # -a must carry the password now, else PING returns NOAUTH and health flaps.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Slip archive. Internal only — no published ports (reach it via the app or an
  # SSH tunnel to :9001). Creds mandatory, same `:?` gate as pg/redis.
  minio:
    image: minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      # 9000 = S3 API, 9001 = web console. Same loopback default as postgres;
      # set MINIO_BIND=0.0.0.0 in .env to reach it across the network.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbuckets:   # one-shot: wait for minio, make the slips bucket, exit
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?set MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD};
      do sleep 1; done; mc mb --ignore-existing local/slips"

  # Traces. The app reaches it over the compose network, so OTLP (4318) is
  # deliberately NOT published — nothing outside the stack should be able to
  # inject spans.
  #
  # The UI is bound to LOOPBACK ONLY and must stay that way: it has no
  # authentication, and traces expose the booking flow, client IPs and table ids.
  # Reach it with:  ssh -L 16686:127.0.0.1:16686 root@<host>
  #
  # ponytail: in-memory storage (the v2 default) — traces are lost on restart.
  # That is fine for debugging a live incident; add a Badger/Elasticsearch volume
  # only if traces ever need to outlive the container.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"   # web UI — loopback only, no auth on this thing

volumes:
  pgdata:
  redisdata:
  miniodata:
